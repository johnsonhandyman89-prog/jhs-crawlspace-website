        <!-- FAQ Schema Markup -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
                {
                    "@type": "Question",
                    "name": "What causes crawlspace moisture problems?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Crawlspace moisture typically comes from three sources: ground moisture evaporating through exposed dirt floors, humid outside air entering through open vents, and water intrusion from poor drainage or grading. In the Upstate of South Carolina, our humid climate and clay-heavy soils make ground moisture especially common."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What is a vapor barrier and why do I need one?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "A vapor barrier is a durable plastic liner installed over the dirt floor of your crawlspace. It prevents ground moisture from evaporating into the crawlspace air, which helps reduce humidity, odors, and the conditions that lead to mold and wood rot. A properly installed vapor barrier with 100% ground coverage is often the most effective first step in crawlspace moisture control."
                    }
                },
                {
                    "@type": "Question",
                    "name": "How long does a crawlspace service typically take?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Most crawlspace services can be completed in one day, depending on size and conditions. We provide a clear timeline during your inspection."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Do I need full encapsulation, or will a vapor barrier help?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Not every crawlspace requires full encapsulation. Many homes see major improvement with proper ground coverage, sealing, and moisture control. We recommend only what your crawlspace actually needs."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Will this help with odors and high humidity in my home?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. Crawlspace moisture is a common cause of musty odors and elevated indoor humidity. Up to 50% of the air you breathe on the first floor comes from your crawlspace, so addressing moisture issues below often improves air quality and comfort throughout the home."
                    }
                },
                {
                    "@type": "Question",
                    "name": "When do I need a dehumidifier in my crawlspace?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "A crawlspace dehumidifier is recommended when humidity levels remain high even after installing a vapor barrier and sealing vents. This is common in homes built on low-lying lots, near water, or in areas with high seasonal humidity. We measure humidity levels during your inspection and recommend a dehumidifier only when it's truly needed."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Is this work important when selling a home?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Absolutely. Crawlspace conditions are commonly flagged during home inspections and CL-100 (Wood Infestation) reports in South Carolina. Addressing moisture, vapor barrier, and ventilation issues before listing — or quickly after an inspection — helps avoid delays and renegotiations that can jeopardize a sale."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Do you offer free inspections?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. We provide free, no-obligation crawlspace inspections for homeowners throughout the Upstate of South Carolina. We'll explain what we find, discuss your options, and give you honest recommendations — even if that means you don't need any work done."
                    }
                }
            ]
        }
        </script>
